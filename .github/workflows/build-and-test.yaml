name: Build and test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      record-all-tests:
        description: Keep a screen recording of every UI test, not only failed ones
        type: boolean
        default: false
  workflow_call:
    inputs:
      record-all-tests:
        description: Keep a screen recording of every UI test, not only failed ones
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for unused usings
        run: dotnet format style WinUia.slnx --diagnostics IDE0005 --severity info --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/*/bin/Release
            tests/*/bin/Release
            examples/*/bin/Release
          if-no-files-found: error
          retention-days: 1

  unit-test:
    name: Run unit tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Unit test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.UnitTests."

  integration-test:
    name: Run integration tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Integration test
        run: dotnet test --no-build --configuration Release --logger GitHubActions --filter "FullyQualifiedName~.IntegrationTests."

  ui-test:
    name: Run UI tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # Screen recordings (WinUia.Recording) need ffmpeg; install it when the runner image lacks it.
      - name: Ensure ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $ffmpeg = (Get-Command ffmpeg).Source
          Write-Host "ffmpeg: $ffmpeg"
          "WINUIA_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV

      - name: UI test
        env:
          WINUIA_RECORDING: ${{ inputs.record-all-tests && 'all' || 'failed' }}
          WINUIA_RECORDING_DIR: ${{ github.workspace }}/TestResults/Recordings
        run: >-
          dotnet test --no-build --configuration Release --logger GitHubActions --logger trx
          --results-directory TestResults --filter "FullyQualifiedName~.UiTests."

      - name: Upload UI test results
        if: failure() || inputs.record-all-tests
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: TestResults
          retention-days: 14
