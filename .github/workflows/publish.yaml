name: Publish

# Publishing a GitHub release publishes the WinUia packages to nuget.org, versioned from the release tag:
# v1.2.0 or V1.2.0 -> 1.2.0, v1.3.0-beta.1 -> 1.3.0-beta.1.
# Authenticates with NuGet trusted publishing: no long-lived API key is stored anywhere. nuget.org trusts this workflow
# (owner buning-software, repository win-uia, workflow publish.yaml, environment nuget) and exchanges its GitHub OIDC
# token for a short-lived API key. The nuget environment holds one secret, NUGET_USER: the nuget.org account name.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The same build and tests as a pull request; nothing is published unless they pass.
  test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yaml

  publish:
    name: Publish to NuGet
    needs: test
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      # Lets NuGet/login request the GitHub OIDC token that nuget.org exchanges for a temporary API key.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from the release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#[vV]}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version such as v1.2.0 or v1.3.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Packs the packable projects only: the modules under src/ (tests and examples are not packable).
      - name: Pack
        run: >-
          dotnet pack WinUia.slnx --configuration Release --output packages
          -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          if-no-files-found: error

      # The temporary API key is valid for an hour, so log in right before the push.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes every .nupkg; nuget.org picks up the .snupkg symbol package next to each one. Bash expands the glob:
      # dotnet nuget push on Windows does not expand "packages/*.nupkg" itself and fails with "File does not exist".
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
