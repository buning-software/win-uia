name: Publish

# nuget.org trusted publishing: it trusts this workflow (owner buning-software, repository win-uia, workflow
# publish.yaml, environment nuget) and exchanges its OIDC token for a short-lived API key; no API key is stored.
# The nuget environment's NUGET_USER secret is the nuget.org account name.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yaml

  publish:
    name: Publish to NuGet
    needs: test
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      packages: write
      # For NuGet/login to request the OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from the release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#[vV]}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version such as v1.2.0 or v1.3.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >-
          dotnet pack WinUia.slnx --configuration Release --output packages
          -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          if-no-files-found: error

      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$GITHUB_TOKEN" --no-symbols \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
          done

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Bash expands the glob: dotnet nuget push on Windows does not and fails with "File does not exist".
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
